# nginx di depan tryout-api. Pasang di VM:
#   sudo cp deploy/nginx/tryout.conf /etc/nginx/sites-available/tryout.conf
#   sudo ln -s /etc/nginx/sites-available/tryout.conf /etc/nginx/sites-enabled/tryout.conf
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream tryout_api {
    # App hanya listen di loopback (compose.prod.yml / HOST=127.0.0.1 di unit systemd).
    server 127.0.0.1:3000;
    # Simpan koneksi ke app supaya tidak buka TCP baru tiap request (butuh proxy_http_version 1.1 di bawah).
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Ganti dengan domain asli kalau ada, lalu tambah HTTPS (certbot --nginx).
    server_name _;

    # Batas body di depan app; app sendiri hanya menerima JSON sampai 10kb. Request lebih besar ditolak 413 di sini.
    client_max_body_size 1m;

    # Kompres JSON besar (leaderboard). Body kecil tidak dikompres karena tidak sepadan dengan CPU-nya.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    # Header Vary: Accept-Encoding, supaya cache/CDN di depan tidak salah kirim versi gzip ke client lain.
    gzip_vary on;
    # Tetap kompres walau request datang lewat proxy lain (mis. load balancer / Cloudflare).
    gzip_proxied any;

    access_log /var/log/nginx/tryout.access.log;
    error_log /var/log/nginx/tryout.error.log warn;

    location / {
        proxy_pass http://tryout_api;
        proxy_http_version 1.1;
        # Kosongkan Connection supaya keepalive ke upstream tidak ditutup oleh header "close" dari client.
        proxy_set_header Connection "";

        # Tanpa header ini app hanya melihat 127.0.0.1 sebagai client dan "http" sebagai skema.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Gagal cepat kalau app mati (502) daripada client menunggu lama; read timeout untuk request yang lambat.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
